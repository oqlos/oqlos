name: Test

on:
  push:
    branches: [main]
    paths:
      - "tests/**"
      - "frontend/**"
      - "oqlos/**"
      - "packages/oqlos-core/**"
      - "packages/oqlos-models/**"
      - "packages/backend-shared-py/**"
      - "scripts/**"
      - "project/**"
      - "docs/refactor-*.md"
      - "Taskfile.yml"
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/test.yml"
jobs:
  static-analysis:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          token: ${{ secrets.ORG_SYNC_PAT }}
          submodules: recursive
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Validate dependency lock
        run: pip install uv==0.11.9 && uv lock --check
      - name: Install pinned analyzer
        run: pip install code2llm==0.5.168 psutil==7.2.2
      - name: Generate refactor analysis
        run: bash scripts/generate-refactor-analysis.sh /tmp/oqlos-refactor-analysis
      - name: Validate analysis metadata
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          output = Path("/tmp/oqlos-refactor-analysis")
          report = json.loads((output / "refactor-audit.json").read_text())
          assert report["git_commit"] == os.environ["GITHUB_SHA"]
          assert report["git_dirty"] is False
          assert report["summary"]["parse_failures"] == 0
          assert report["generator"]["code2llm"]["package_version"] == "0.5.168"
          assert all(report["artifacts"].values())
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: refactor-analysis
          path: /tmp/oqlos-refactor-analysis

  pytest:
    runs-on: ubuntu-latest
    env:
      OQLOS_SCENARIOS_DIR: ${{ github.workspace }}/packages/oql-scenario
    steps:
      - uses: actions/checkout@v5
        with:
          token: ${{ secrets.ORG_SYNC_PAT }}
          submodules: recursive
          persist-credentials: false
      - name: Check out the Modbus workspace dependency
        uses: actions/checkout@v5
        with:
          repository: oqlos/pimodbus
          path: packages/pimodbus
          token: ${{ secrets.ORG_SYNC_PAT }}
          persist-credentials: false
      - name: Check out the canonical OQL scenarios
        uses: actions/checkout@v5
        with:
          repository: oqlos/oql-scenario
          path: packages/oql-scenario
          token: ${{ secrets.ORG_SYNC_PAT }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          package-manager-cache: false
      - name: Build frontend assets
        run: npm ci --prefix frontend && npm run build --prefix frontend
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e packages/backend-shared-py -e packages/pimodbus -e packages/oqlos-models -e packages/oqlos-core -e ".[dev]"
      - name: Check undefined and duplicate definitions
        run: ruff check oqlos tests packages/oqlos-core packages/oqlos-models --select F821,F811
      - name: Run pytest
        run: pytest -q

  pytest-wheel:
    runs-on: ubuntu-latest
    env:
      OQLOS_SCENARIOS_DIR: ${{ github.workspace }}/packages/oql-scenario
    steps:
      - uses: actions/checkout@v5
        with:
          token: ${{ secrets.ORG_SYNC_PAT }}
          submodules: recursive
          persist-credentials: false
      - name: Check out the Modbus workspace dependency
        uses: actions/checkout@v5
        with:
          repository: oqlos/pimodbus
          path: packages/pimodbus
          token: ${{ secrets.ORG_SYNC_PAT }}
          persist-credentials: false
      - name: Check out the canonical OQL scenarios
        uses: actions/checkout@v5
        with:
          repository: oqlos/oql-scenario
          path: packages/oql-scenario
          token: ${{ secrets.ORG_SYNC_PAT }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          package-manager-cache: false
      - name: Build frontend assets
        run: npm ci --prefix frontend && npm run build --prefix frontend
      - name: Build local workspace wheels
        run: |
          python -m pip install --upgrade pip build
          python -m build --wheel packages/backend-shared-py
          python -m build --wheel packages/pimodbus
          python -m build --wheel packages/oqlos-models
          python -m build --wheel packages/oqlos-core
          python -m build --wheel .
      - name: Install wheels and test dependencies
        run: |
          pip install packages/backend-shared-py/dist/*.whl
          pip install packages/pimodbus/dist/*.whl
          pip install packages/oqlos-models/dist/*.whl
          pip install packages/oqlos-core/dist/*.whl
          pip install dist/*.whl
          pip install pytest pytest-asyncio
      - name: Run full suite against installed wheels
        working-directory: /tmp
        env:
          OQLOS_TEST_INSTALLED_WHEEL: "1"
        run: >-
          pytest -q
          --rootdir=${{ github.workspace }}
          -o pythonpath=[]
          ${{ github.workspace }}/tests
          ${{ github.workspace }}/packages/oqlos-core/tests
          ${{ github.workspace }}/packages/oqlos-models/tests

  frontend-unit:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          package-manager-cache: false
      - name: Install frontend deps
        run: npm ci
      - name: Run frontend unit tests
        run: npm run test:unit
