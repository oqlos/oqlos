name: Test

on:
  push:
    branches: [main, master]
    paths:
      - "tests/**"
      - "frontend/**"
      - "oqlos/**"
      - "packages/oqlos-core/**"
      - "packages/oqlos-models/**"
      - "packages/backend-shared-py/**"
      - "pyproject.toml"
      - ".github/workflows/test.yml"
  pull_request:
    paths:
      - "tests/**"
      - "frontend/**"
      - "oqlos/**"
      - "packages/oqlos-core/**"
      - "packages/oqlos-models/**"
      - "packages/backend-shared-py/**"
      - "pyproject.toml"
      - ".github/workflows/test.yml"

jobs:
  pytest:
    runs-on: ubuntu-latest
    env:
      OQLOS_SCENARIOS_DIR: ${{ github.workspace }}/packages/oql-scenario
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Check out the Modbus workspace dependency
        uses: actions/checkout@v4
        with:
          repository: oqlos/pimodbus
          path: packages/pimodbus
      - name: Check out the canonical OQL scenarios
        uses: actions/checkout@v4
        with:
          repository: oqlos/oql-scenario
          path: packages/oql-scenario
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Build frontend assets
        run: npm ci --prefix frontend && npm run build --prefix frontend
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e packages/backend-shared-py -e packages/pimodbus -e packages/oqlos-models -e packages/oqlos-core -e ".[dev]"
      - name: Check undefined and duplicate definitions
        run: ruff check oqlos tests packages/oqlos-core packages/oqlos-models --select F821,F811
      - name: Run pytest
        run: pytest -q

  pytest-wheel:
    runs-on: ubuntu-latest
    env:
      OQLOS_SCENARIOS_DIR: ${{ github.workspace }}/packages/oql-scenario
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Check out the Modbus workspace dependency
        uses: actions/checkout@v4
        with:
          repository: oqlos/pimodbus
          path: packages/pimodbus
      - name: Check out the canonical OQL scenarios
        uses: actions/checkout@v4
        with:
          repository: oqlos/oql-scenario
          path: packages/oql-scenario
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Build frontend assets
        run: npm ci --prefix frontend && npm run build --prefix frontend
      - name: Build local workspace wheels
        run: |
          python -m pip install --upgrade pip build
          python -m build --wheel packages/backend-shared-py
          python -m build --wheel packages/pimodbus
          python -m build --wheel packages/oqlos-models
          python -m build --wheel packages/oqlos-core
          python -m build --wheel .
      - name: Install wheels and test dependencies
        run: |
          pip install packages/backend-shared-py/dist/*.whl
          pip install packages/pimodbus/dist/*.whl
          pip install packages/oqlos-models/dist/*.whl
          pip install packages/oqlos-core/dist/*.whl
          pip install dist/*.whl
          pip install pytest pytest-asyncio
      - name: Run full suite against installed wheels
        working-directory: /tmp
        env:
          OQLOS_TEST_INSTALLED_WHEEL: "1"
        run: >-
          pytest -q
          --rootdir=${{ github.workspace }}
          -o pythonpath=[]
          ${{ github.workspace }}/tests
          ${{ github.workspace }}/packages/oqlos-core/tests
          ${{ github.workspace }}/packages/oqlos-models/tests

  frontend-unit:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install frontend deps
        run: npm ci
      - name: Run frontend unit tests
        run: npm run test:unit
