[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "oqlos-core"
version = "0.2.1"
description = "OqlOS CQL/OQL parser, interpreter runtime, and event store (no FastAPI/Modbus by default)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
dependencies = [
    "oqlos-models==0.2.0",
    "pydantic>=2.0",
    "PyYAML>=6.0",
    "httpx>=0.25",
]

[project.optional-dependencies]
firmware = ["oqlos>=0.1.29"]

[tool.setuptools.packages.find]
where = ["src"]
include = ["oqlos.core*", "oqlos.shared*"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
