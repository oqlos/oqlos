[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "oqlos-models"
version = "0.2.0"
description = "OqlOS scenario and DSL pydantic/dataclass models"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
dependencies = [
    "pydantic>=2.0",
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["oqlos.models*"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
