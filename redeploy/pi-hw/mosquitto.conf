# Mosquitto config for the OqlOS hardware node (pi-hw / 192.168.188.110).
# Runs as a systemd --user service. The OQL-over-MQTT controller (pi109) and the
# local agent both authenticate with the single `oqlos` credential.
#
# Security: anonymous access is OFF. Create the password file once with:
#   mosquitto_passwd -c /home/pi/maskservice/config/mosquitto.passwd oqlos
# For deployments beyond a trusted LAN, add TLS (listener 8883 + certfile/keyfile).

listener 1883 0.0.0.0
allow_anonymous false
password_file /home/pi/maskservice/config/mosquitto.passwd

persistence true
persistence_location /home/pi/maskservice/mosquitto/

log_dest file /home/pi/maskservice/logs/mosquitto.log
log_type warning
log_type error
log_type notice
