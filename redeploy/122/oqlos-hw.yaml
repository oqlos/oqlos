# OqlOS hardware-node plugin config (boardnet / 192.168.188.131).
#
# This is the base config copied to /home/pi/maskservice/config/oqlos-real.yaml by
# the `apply-oqlos-hw-config` deploy step. BoardNet identities are pinned to
# stable serial-by-id names and verified read-only at every service start. Raw
# ttyACM/ttyUSB enumeration numbers are never an authoritative configuration.
#
# Motor sidecars run on THIS Pi at loopback (127.0.0.1), never host.docker.internal.

schemaVersion: hardware-configuration-v1

plugins:
  # Legacy Waveshare Modbus ADC. Pressure inputs now use usb-adc-stack:
  # MCP2221A over USB (AI01) and DFR1184 over Raspberry Pi UART (AI02/AI03).
  # Keep the schema entry for compatibility, but never let deploy autodetection
  # claim the MCP2221 CDC interface as a Modbus RTU device.
  modbus-adc:
    enabled: false
    connection_type: modbus-rtu
    connection_params:
      serial_port: /dev/serial/by-id/adc-not-present
      baudrate: 4800
      parity: N
      device_id: 2
      read_address: 0
      read_count: 8
    timeout: 2.0
    retry_count: 3
    peripherals:
      ai01: {name: AI01 NC pressure, type: sensor, scale: {min: 0, max: 20000, default: 0, unit: raw}, conversion: {type: none}}
      ai02: {name: AI02 SC pressure, type: sensor, scale: {min: 0, max: 20000, default: 0, unit: raw}, conversion: {type: none}}
      ai03: {name: AI03 WC pressure, type: sensor, scale: {min: 0, max: 20000, default: 0, unit: raw}, conversion: {type: none}}

  # DFRobot DRI0050 — PWM pump driver (sidecar on this Pi)
  motor-dri0050:
    enabled: true
    connection_type: http
    connection_params:
      base_url: http://127.0.0.1:8203
    timeout: 2.0
    retry_count: 3
    peripherals:
      speed: {name: speed, type: pump, scale: {min: 0, max: 100, default: 0, unit: "l/min"}, conversion: {type: linear, scale: 0.1, offset: 0}}
      power: {name: power, type: pump, scale: {min: 0, max: 100, default: 0, unit: "%"}, conversion: {type: linear, scale: 0.02, offset: 0}}

  # Waveshare Modbus RTU IO 8CH — valve controller
  modbus-io:
    enabled: true
    metadata:
      required: true
    connection_type: modbus-rtu
    connection_params:
      serial_port: /dev/serial/by-id/usb-1a86_USB_Single_Serial_5958006895-if00
      baudrate: 4800
      parity: N
      device_id: 2
    timeout: 2.0
    retry_count: 3
    peripherals:
      state: {name: state, type: valve, scale: {min: 0, max: 1, default: 0, unit: ""}, raster: [0, 1], conversion: {type: none}}

  # Pololu Tic T249 — stepper motor / artificial lung (sidecar on this Pi)
  motor-tic249:
    enabled: true
    connection_type: http
    connection_params:
      base_url: http://127.0.0.1:8205
    timeout: 2.0
    retry_count: 3
    peripherals:
      steps: {name: steps, type: lung, scale: {min: 0, max: 10000, default: 500, unit: steps}, conversion: {type: none}}
      speed: {name: speed, type: lung, scale: {min: 0, max: 1000, default: 1000, unit: "steps/s"}, conversion: {type: none}}

profiles:
  hui:
    holds:
      head-inflate: {valves_on: [valve-5, valve-2], pump_pct: 70}
      head-deflate: {valves_on: [valve-3, valve-6], pump_pct: 0}
      lp-pwm-plus5: {valves_on: [valve-5], pump_pct: 50}
      lp-pwm-plus10: {valves_on: [valve-5], pump_pct: 100}
      lp-pwm-minus5: {valves_on: [valve-6], pump_pct: 50}
      lp-pwm-minus10: {valves_on: [valve-6], pump_pct: 100}
      lp-bleed: {valves_on: [valve-4], pump_pct: 0}
    valves:
      wc-press: {valve_id: valve-wc, value: true}
      wc-bleed: {valve_id: valve-wc, value: false}
    lung:
      valve_id: valve-4
      direction: right
      start_direction: right
      limit_mode: reverse_on_limit

runtime:
  motor2:
    peripheralId: motor-tic249
    strokeSteps: 1000
    cycleVolumeLiters: 5
    maxStepsPerSecond: 1000
    defaultSpeedStepsPerSecond: 1000
    speedUnit: steps/s
    accelerationPercentPerSecond: 100
    accelerationUnit: "%/s"
    limitMode: reverse_on_limit
    startDirection: right
    idleState: deenergized
    deenergizeOnStop: true
    deenergizeOnStartup: true
