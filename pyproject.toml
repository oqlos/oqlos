[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "oqlos"
version = "0.1.0"
description = "OqlOS — Operation Query Language runtime for hardware testing"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "Apache-2.0"}
dependencies = [
    "fastapi>=0.110",
    "uvicorn>=0.28",
    "pydantic>=2.0",
    "pyserial>=3.5",
    "pymodbus>=3.6",
]

[project.scripts]
oqlos-server = "oqlos.api.main:run"

[project.optional-dependencies]
rpi = ["RPi.GPIO>=0.7", "smbus2>=0.4"]
dev = ["pytest", "pytest-asyncio", "httpx"]

[tool.setuptools.packages.find]
include = ["oqlos*"]
