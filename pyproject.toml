[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "oqlos"
version = "0.1.35"
description = "OqlOS — Operation Query Language runtime for hardware testing"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "oqlos-models==0.2.0",
    "oqlos-core==0.2.1",
    "fastapi>=0.110",
    "uvicorn>=0.28",
    "pydantic>=2.0",
    "pydantic-settings>=2.2.0",
    "pyserial>=3.5",
    "pymodbus>=3.6",
    "httpx>=0.25",
    "nfo>=0.2.3",
    "goal>=2.1.0",
    "costs>=0.1.20",
    "pfix>=0.1.60",
    "paho-mqtt>=1.6.1",
    "pluggy>=1.4",
    "pytest-asyncio>=0.23",
    "PyYAML>=6.0",
    "testql>=0.2.0",
]

[project.license]
text = "Apache-2.0"

[project.scripts]
oqlos-server = "oqlos.api.main:run"
oqlctl = "oqlos.tools.cql_cli:main"
oqlos-events = "oqlos.shared.event_server:main"
oqlos-modbus-probe = "oqlos.tools.hardware_diagnose.modbus_probe:main"

[project.optional-dependencies]
rpi = ["RPi.GPIO>=0.7", "smbus2>=0.4"]
server = ["websockets>=13.0"]
dev = ["pytest", "pytest-asyncio", "httpx", "websockets>=13.0",
    "goal>=2.1.0",
    "costs>=0.1.20",
    "pfix>=0.1.60",
    "paho-mqtt>=1.6.1",
]
# Hardware service dependencies (for running microservices)
hardware-services = ["dri0050>=1.0.0", "piADC>=1.0.0", "piRTC>=1.0.0"]

[tool.setuptools.packages.find]
include = ["oqlos*"]
exclude = ["oqlos.models*", "oqlos.shared.event_store"]

[tool.pfix]
# Self-healing Python configuration
model = "openrouter/qwen/qwen3-coder-next"
auto_apply = true
auto_install_deps = true
auto_restart = false
max_retries = 3
create_backups = false
git_auto_commit = false

[tool.pfix.runtime_todo]
enabled = true
todo_file = "TODO.md"
min_severity = "low"
deduplicate = true

[tool.costs]
# AI Cost tracking configuration
badge = true
update_readme = true
readme_path = "README.md"
default_model = "openrouter/qwen/qwen3-coder-next"
analysis_mode = "byok"
full_history = true
max_commits = 500

# Cost thresholds for badge colors (USD)
badge_color_thresholds = { low = 1.0, medium = 5.0, high = 10.0, critical = 50.0 }
